name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `pnpm install` runs the `prepare` script; git hooks have no use on a runner.
  HUSKY: "0"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test --filter=@neomorphic-react/ui

  test-storybook:
    name: Storybook Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/storybook

      # On a cold cache Vite discovers dependencies mid-run and reloads the
      # browser, failing whichever story was running. The first pass fills the
      # cache; the second is the one that counts.
      - name: Warm Vite dependency cache
        run: pnpm test --filter=@neomorphic-react/storybook || true

      - name: Run Storybook interaction tests
        run: pnpm test --filter=@neomorphic-react/storybook

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Library (tsup + type declarations) and the static Storybook.
      - name: Build all workspaces
        run: pnpm build

      # Storybook blocks, stories, tests and component sources never ship.
      - name: Check npm package contents
        run: pnpm check:pack

      # publint + attw against the tarball pnpm would publish.
      - name: Lint npm package
        run: pnpm lint:package

      - name: Upload Storybook for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/storybook/storybook-static

  # Publishes the Storybook built above to
  # https://punyprogrammer.github.io/neomorphic-ui/, only from `main` and only
  # once every test has passed. Repo Settings → Pages → Source must be
  # "GitHub Actions".
  deploy-storybook:
    name: Deploy Storybook
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, test-storybook, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
